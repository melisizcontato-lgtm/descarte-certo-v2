services:
  - type: web
    name: descarte-certo
    runtime: node
    plan: free
    buildCommand: node --check server.js && node --check app.js
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
